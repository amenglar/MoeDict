[package]
name = "moedict"
version = "0.1.0"
edition = "2024"
description = "MoeDict — a lightweight MDX dictionary for the desktop"
authors = ["zhimoe"]
license = "MIT OR Apache-2.0"

[lib]
name = "moedict_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdict-core = { path = "../crates/mdict-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
