[package]
name = "mdict-core"
version = "0.1.0"
edition = "2024"
description = "MDX/MDD parsing, indexing and search engine for MoeDict"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
zstd = "0.13"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
encoding = "0.2"
ripemd = "0.1"
fastrand = "2"
log = "0.4"
minilzo-rs = "0.6"

[dev-dependencies]
tempfile = "3"
