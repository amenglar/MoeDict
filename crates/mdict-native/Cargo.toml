[package]
name = "moedict-native"
version = "0.1.0"
edition = "2024"
description = "GPUI-based native MDX dictionary reader"

[dependencies]
mdict-core = { path = "../mdict-core" }
gpui = "=0.2.2"
gpui-component = "=0.5.1"
html5ever = "=0.27.0"
markup5ever = "=0.12.1"
markup5ever_rcdom = "=0.3.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
lru = "0.13"
dirs = "6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
encoding_rs = "0.8"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rodio = "0.20"
